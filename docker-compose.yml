services:
  api:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped